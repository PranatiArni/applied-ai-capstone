<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>New Entry · Daily Study Tracker</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    label { display: block; margin: 1rem 0 0.25rem; font-weight: 600; }
    input, textarea { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 6px; font: inherit; box-sizing: border-box; }
    .actions { margin-top: 1.5rem; }
    button { background: #1a2540; color: #fff; padding: 0.5rem 1.25rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; }
    a { color: #555; margin-left: 1rem; }
  </style>
</head>
<body>
  <h1>New entry</h1>

  <form method="POST">
    <label for="date">Date</label>
    <input id="date" name="date" type="date" value="{{ today }}">

    <label for="subject">Subject</label>
    <input id="subject" name="subject" type="text">

    <label for="notes">Notes</label>
    <textarea id="notes" name="notes" rows="6"></textarea>

    <div class="actions">
      <button type="submit">Save entry</button>
      <a href="{{ url_for('home') }}">Cancel</a>
    </div>
  </form>
</body>
</html>
